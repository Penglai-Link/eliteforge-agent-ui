<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Agent UI Terminal Demo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f4f5f7; color: #17202a; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 1120px; margin: 0 auto; padding: 48px 32px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
      h1 { margin: 2px 0 6px; font-size: 30px; letter-spacing: -.04em; }
      header p { margin: 0; color: #68717d; }
      .eyebrow { color: #5573db; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
      .badge { flex: none; padding: 7px 11px; border: 1px solid #dbe0e8; border-radius: 999px; background: #fff; color: #596372; font-size: 12px; }
      #terminal { height: min(68vh, 640px); min-height: 380px; overflow: hidden; border: 1px solid #d8dde5; border-radius: 12px; background: #10151c; box-shadow: 0 20px 55px #1822381c; }
      code { padding: 2px 5px; border-radius: 4px; background: #e9edf3; font-size: .9em; }
      @media (max-width: 640px) { main { padding: 28px 16px; } header { align-items: flex-start; flex-direction: column; } #terminal { min-height: 340px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">ELITEFORGE AGENT UI</p>
          <h1>终端组件演示</h1>
          <p>模拟宿主提供 PTY 与 AI 传输；输入 <code>#问题</code> 试用 AI。</p>
        </div>
        <span class="badge">本地模拟 · 不连接服务端</span>
      </header>
      <section id="terminal" aria-label="交互式模拟终端"></section>
    </main>
    <script type="module" src="/test/index.ts"></script>
  </body>
</html>
