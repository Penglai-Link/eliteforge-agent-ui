<!DOCTYPE html>
<html lang="zh-CN">
  <meta charset="UTF-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      background: var(--color-background, #fdf8f8);
      color: var(--color-on-surface, #1c1b1b);
      font-size: 14px;
    }
    main {
      max-width: 1120px;
      margin: auto;
    }
    main > button {
      margin-bottom: 20px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .demo-nav {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }
    .demo-gallery {
      align-items: start;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .demo-example {
      min-width: 0;
      border: 1px solid var(--color-card-border, #e5e5e5);
      border-radius: 10px;
      padding: 20px;
      background: var(--color-surface-container-lowest, #fff);
    }
    .demo-example > h3 {
      margin: 0 0 16px;
      font: 500 12px ui-monospace, monospace;
      color: var(--color-on-surface-variant, #626267);
      letter-spacing: 0.02em;
    }
    #composed-examples {
      margin-top: 48px;
    }
    @media (max-width: 700px) {
      .demo-gallery {
        grid-template-columns: 1fr;
      }
    }
    main > h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    main > h2,
    section > h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }
    main > p,
    section > p {
      color: var(--color-on-surface-variant, #626267);
      line-height: 1.6;
    }
    .demo-nav a {
      color: inherit;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .demo-nav a:hover {
      background: var(--color-hover-surface, #f2f2f7);
    }
    pre {
      overflow: auto;
      font-size: 13px;
    }
  </style>
  <title>A2UI Vue 组件展示</title>
  <div id="app"></div>
  <script type="module" src="/demo.ts"></script>
</html>
