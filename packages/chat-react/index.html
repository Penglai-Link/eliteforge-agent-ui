<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Chat React Demo</title>
  </head>
  <body>
    <div id="root"></div>
    <button style="position: absolute">切换主题</button>
    <script src="./test/index.tsx" type="module"></script>
    <script>
      // 切换主题
      document.querySelector("button").addEventListener("click", () => {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const newTheme =
          currentTheme === "matrix-dark" ? "light" : "matrix-dark";
        document.documentElement.setAttribute("data-theme", newTheme);
      });
    </script>
  </body>
</html>
